<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1e24; font: 12px Consolas, monospace; color: #dde3ee; }
  #labels { position: fixed; inset: 0; pointer-events: none; }
  .lbl { position: absolute; transform: translate(-50%, 0); background: rgba(0,0,0,.6); padding: 2px 6px; border-radius: 3px; white-space: nowrap; }
  #info { position: fixed; left: 8px; top: 8px; background: rgba(0,0,0,.55); padding: 6px 8px; white-space: pre; max-width: 60vw; }
  .xh { position: fixed; left: 50%; top: 50%; width: 16px; height: 16px; margin: -8px 0 0 -8px; pointer-events: none; }
  .xh:before, .xh:after { content: ''; position: absolute; background: #3f3; }
  .xh:before { left: 7px; top: 0; width: 2px; height: 16px; }
  .xh:after { top: 7px; left: 0; height: 2px; width: 16px; }
</style>
</head>
<body>
<div id="labels"></div>
<div id="info"></div>
<script type="module" src="./viewer.js"></script>

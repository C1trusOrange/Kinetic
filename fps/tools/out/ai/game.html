<body>
<div id="game"></div>
<div id="ui"></div>
<div id="boot-message" class="boot-message">Loading KINETIC&hellip;</div>
<script>
  // Plain (non-module) watchdog: explains the two most common failure modes.
  (function () {
    var box = document.getElementById('boot-message');
    if (location.protocol === 'file:') {
      box.innerHTML = 'KINETIC must be served over HTTP.<br>Run <b>play.bat</b> (or <code>python tools/serve.py</code>) and open <b>http://localhost:8000</b>.';
      return;
    }
    setTimeout(function () {
      if (!window.__GAME__) {
        box.innerHTML = 'The game failed to start. Open the browser console (F12) for details.';
      }
    }, 15000);
  })();
</script>
<script type="module" src="/src/main.js"></script>
</body>

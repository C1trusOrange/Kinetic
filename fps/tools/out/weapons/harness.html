<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>weapons harness</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}#hud{position:fixed;left:8px;top:8px;color:#9fe8ff;font:12px monospace;white-space:pre}</style>
<script>
  // import map is built at runtime so the same page can use the stub models or the real ones (?models=real)
  (function () {
    var P = new URLSearchParams(location.search);
    var imports = {
      'three': '/vendor/three/build/three.module.js',
      'three/addons/': '/vendor/three/examples/jsm/',
    };
    if (P.get('models') !== 'real') imports['/src/weapons/WeaponModels.js'] = '/tools/out/weapons/models_stub.js';
    var s = document.createElement('script');
    s.type = 'importmap';
    s.textContent = JSON.stringify({ imports: imports });
    document.head.appendChild(s);
  })();
</script>
</head>
<body>
<div id="hud"></div>
<script type="module" src="/tools/out/weapons/harness.js"></script>
</body>
</html>

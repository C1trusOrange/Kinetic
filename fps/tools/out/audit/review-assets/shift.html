</head><body><div id="root"></div><script type="module">
import * as THREE from 'three';
window.__DONE__ = false;
try {
  const T = await import('/src/world/Textures.js');
  const renderer = new THREE.WebGLRenderer(); T.initTextures(renderer);

  const names = q.get('names') ? q.get('names').split(',') : T.MATERIAL_NAMES;
  const slot = q.get('slot') || 'map';

  for (const n of names) {

    const h = S / 2, d = size / 2;
    ctx.drawImage(src, h, h, h, h, 0, 0, d, d);
    ctx.drawImage(src, 0, h, h, h, d, 0, d, d);
    ctx.drawImage(src, h, 0, h, h, 0, d, d, d);

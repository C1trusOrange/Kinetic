</head><body><script type="module">

window.__DONE__ = false;
window.__RES__ = {};

  const WM = await import('/src/weapons/WeaponModels.js');

  }

      const r = inspect(m.root);
      const partInfo = {};

      }

        parts: partInfo, muzzle: wp(m.muzzle), sight: wp(m.sight), eject: wp(m.ejectPort), hip: m.hip.toArray(), adsDistance: m.adsDistance,

    }

  const a = WM.createWeaponModel('rifle', { view: true }), b = WM.createWeaponModel('rifle', { view: true });

  out.sharing = { sharedGeo, sharedMat, sepGroups, meshes: ga.length };

  try { WM.createWeaponModel('grenade'); out.unknownGrenade = 'no throw'; } catch (e) { out.unknownGrenade = 'throws: ' + e.message; }

  const gbb = new THREE.Box3().setFromObject(gr), rbb = new THREE.Box3().setFromObject(rk);
  out.grenade = { tris: triCount(gr), size: gbb.getSize(new THREE.Vector3()).toArray(), center: gbb.getCenter(new THREE.Vector3()).toArray(), inspect: inspect(gr) };
  out.rocket = { tris: triCount(rk), size: rbb.getSize(new THREE.Vector3()).toArray(), center: rbb.getCenter(new THREE.Vector3()).toArray(), flame: !!rk.userData.flame, inspect: inspect(rk) };
  // frame timings of preload

} catch (e) { window.__RES__ = { fatal: String(e && e.stack || e) }; }

</script></body></html>

</head><body><script type="module">
import * as THREE from 'three';
window.__DONE__ = false; window.__RES__ = {};
try {
  const T = await import('/src/world/Textures.js');
  const renderer = new THREE.WebGLRenderer();
  T.initTextures(renderer);
  const q = new URLSearchParams(location.search);
  const name = q.get('name'), slot = q.get('slot'), ch = +(q.get('ch') || 1);
  const m = T.getMaterial(name);

  const d = c.getContext('2d').getImageData(0, 0, S, S).data;

  }
  window.__RES__ = { n: bad.length, first: bad.slice(0, 25) };
} catch (e) { window.__RES__ = { fatal: String(e && e.stack || e) }; }
window.__DONE__ = true;
</script></body></html>

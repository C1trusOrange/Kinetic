<html><head><meta charset="utf-8"><link rel="icon" href="data:,"><title>procgen</title>
<script type="importmap">{"imports":{"three":"/vendor/three/build/three.module.js","three/addons/":"/vendor/three/examples/jsm/"}}</script>
</head><body><script type="module">
import * as THREE from 'three';
window.__DONE__ = false; window.__RES__ = {};
try {
  const P = await import('/src/core/procgen.js');
  const out = {};
  const n = new P.TileNoise(7);
  // tileability
  let maxErr = 0, maxRange = 0, minR = 9, maxR = -9;
  for (let i = 0; i < 2000; i++) {
    const u = Math.random(), v = Math.random();
    for (const f of [1, 2, 3, 4, 8, 13, 32, 64, 128]) {
      const a = n.fbm(u, v, f, 3), b = n.fbm(u + 1, v, f, 3), c = n.fbm(u, v + 1, f, 3), d = n.fbm(u - 1, v - 1, f, 3);
      maxErr = Math.max(maxErr, Math.abs(a - b), Math.abs(a - c), Math.abs(a - d));
      minR = Math.min(minR, a); maxR = Math.max(maxR, a);
    }
  }
  out.fbmTileErr = maxErr; out.fbmRange = [minR, maxR];
  // non integer frequency
  let e2 = 0;
  for (let i = 0; i < 500; i++) { const u = Math.random(), v = Math.random(); e2 = Math.max(e2, Math.abs(n.fbm(u, v, 2.5, 3) - n.fbm(u + 1, v, 2.5, 3))); }
  out.fbmNonIntTileErr = e2;
  // big frequencies > 256
  let e3 = 0;
  for (let i = 0; i < 500; i++) { const u = Math.random(), v = Math.random(); e3 = Math.max(e3, Math.abs(n.fbm(u, v, 256, 2) - n.fbm(u + 1, v, 256, 2)), Math.abs(n.fbm(u, v, 300, 1) - n.fbm(u + 1, v, 300, 1))); }
  out.fbmBigFreqTileErr = e3;
  let w = 0, wmin = 9, wmax = -9;
  for (let i = 0; i < 2000; i++) { const u = Math.random(), v = Math.random(); const a = n.worley(u, v, 8), b = n.worley(u + 1, v, 8), c = n.worley(u, v - 1, 8); w = Math.max(w, Math.abs(a - b), Math.abs(a - c)); wmin = Math.min(wmin, a); wmax = Math.max(wmax, a); }
  out.worleyTileErr = w; out.worleyRange = [wmin, wmax];
  let rmin = 9, rmax = -9, re = 0;
  for (let i = 0; i < 2000; i++) { const u = Math.random(), v = Math.random(); const a = n.ridged(u, v, 4, 4); rmin = Math.min(rmin, a); rmax = Math.max(rmax, a); re = Math.max(re, Math.abs(a - n.ridged(u + 1, v, 4, 4))); }
  out.ridged = [rmin, rmax, re];
  // blur vs brute force
  const S = 16;
  const f = new P.Field(S); f.apply((u, v, x, y) => Math.sin(x * 1.7) * Math.cos(y * 0.9) + (x * y % 7));
  for (const [r, passes] of [[1, 1], [2, 1], [3, 2], [7, 1], [9, 1], [20, 1]]) {
    const g = f.clone();
    g.blur(r, passes);
    let ref = f.clone();
    for (let p = 0; p < passes; p++) {
      const t = new P.Field(S);
      for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
        let s = 0, c = 0;
        for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) { s += ref.get(x + dx, y + dy); c++; }
        t.data[y * S + x] = s / c;
      }
      ref = t;
    }
    let err = 0; for (let i = 0; i < S * S; i++) err = Math.max(err, Math.abs(g.data[i] - ref.data[i]));
    out['blur_r' + r + '_p' + passes] = err;
  }
  // rect / circle / line wrap and modes
  const h = new P.Field(8, 8, 0);
  h.rect(6, 6, 4, 4, 1);
  out.rectWrap = [h.get(6, 6), h.get(7, 7), h.get(0, 0), h.get(1, 1), h.get(2, 2), h.get(5, 5)];
  // normal map orientation: height increases toward +u (right) and toward +v (up on screen = smaller canvas y)
  const hu = new P.Field(8, 8).apply((u, v) => u);
  const nu = hu.toNormalCanvas(3).getContext('2d').getImageData(3, 3, 1, 1).data;
  const hv = new P.Field(8, 8).apply((u, v) => 1 - v);  // canvas y down = -v; so height = 1 - v_canvas = v_tex-up increases with tex v
  const nv = hv.toNormalCanvas(3).getContext('2d').getImageData(3, 3, 1, 1).data;
  out.normalRight = [nu[0], nu[1], nu[2]]; // expect R < 128 (normal leans -u)
  out.normalUp = [nv[0], nv[1], nv[2]];    // height rising with texture v -> normal leans -v: G < 128
  // hexToRgb
  out.hex = [P.hexToRgb('#ff8000'), P.hexToRgb(0x336699)];
  // noiseField normalized
  const nf = P.noiseField(64, 4, 4, 5); let lo = 9, hi = -9; for (const v of nf.data) { lo = Math.min(lo, v); hi = Math.max(hi, v); }
  out.noiseField = [lo, hi, P.noiseField(64, 4, 4, 5) === nf];
  // colorRamp
  const cr = P.colorRamp([[0, '#000000'], [1, '#ffffff']]);
  out.ramp = [cr(-1), cr(0.5), cr(2)];
  // buildTextureSet
  const set = P.buildTextureSet({ size: 32, albedo: () => [0.5, 0.5, 0.5], height: new P.Field(32, 32, 0.5), roughness: new P.Field(32, 32, 0.4), metalness: 0.2 });
  out.set = { keys: Object.keys(set), mapCS: set.map.colorSpace, nCS: set.normalMap.colorSpace, rCS: set.roughnessMap.colorSpace };
  window.__RES__ = out;
} catch (e) { window.__RES__ = { fatal: String(e && e.stack || e) }; }
window.__DONE__ = true;
</script></body></html>

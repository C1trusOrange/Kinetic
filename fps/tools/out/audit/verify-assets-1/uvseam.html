<!doctype html>
<html><head><meta charset="utf-8"><link rel="icon" href="data:,"><title>uvseam</title>
<script type="importmap">{"imports":{"three":"/vendor/three/build/three.module.js","three/addons/":"/vendor/three/examples/jsm/"}}</script>
</head><body><script type="module">
import * as THREE from 'three';
window.__DONE__ = false; window.__RES__ = {};
try {
  const WM = await import('/src/weapons/WeaponModels.js');
  const MK = await import('/src/weapons/models/ModelKit.js');
  const WMat = await import('/src/weapons/models/WeaponMaterials.js');
  const out = window.__RES__;
  // 1. isolated cylinders
  function analyze(geo, su) {
    const p = geo.attributes.position, uv = geo.attributes.uv;
    let bad = 0, tot = 0, worst = 0, badArea = 0, totArea = 0;
    const A = new THREE.Vector3(), B = new THREE.Vector3(), C = new THREE.Vector3();
    const e = (i, j) => { const d3 = new THREE.Vector3().fromBufferAttribute(p, i).distanceTo(new THREE.Vector3().fromBufferAttribute(p, j)); const du = uv.getX(i) - uv.getX(j), dv = uv.getY(i) - uv.getY(j); return [d3, Math.hypot(du, dv)]; };
    for (let i = 0; i < p.count; i += 3) {
      let r = 0;
      for (const [a, b] of [[0, 1], [1, 2], [2, 0]]) { const [d3, duv] = e(i + a, i + b); if (d3 > 1e-6) r = Math.max(r, duv * su / d3); }
      A.fromBufferAttribute(p, i); B.fromBufferAttribute(p, i + 1); C.fromBufferAttribute(p, i + 2);
      const area = new THREE.Vector3().subVectors(B, A).cross(new THREE.Vector3().subVectors(C, A)).length() / 2;
      tot++; totArea += area; worst = Math.max(worst, r);
      if (r > 2.5) { bad++; badArea += area; }
    }
    return { tris: tot, bad, worst: +worst.toFixed(1), badAreaPct: +(100 * badArea / totArea).toFixed(1) };
  }
  out.iso = {};
  for (const seg of [8, 10, 12, 14]) {
    for (const axis of ['z', 'y', 'x']) {
      const b = new MK.ModelBuilder({ hi: true });
      b.cyl('paintOlive', { r: 0.05, len: 0.3, seg, axis });
      const tpl = b.build();
      const g = tpl.parts.body.meshes[0].geometry;
      out.iso[`cyl seg${seg} axis${axis}`] = analyze(g, WMat.UV_SCALE.paintOlive);
    }
  }
  // where is the stretched facet?  (centroid of bad triangles)
  { const b = new MK.ModelBuilder({ hi: true }); b.cyl('paintOlive', { r: 0.05, len: 0.3, seg: 14, axis: 'z' });
    const g = b.build().parts.body.meshes[0].geometry; const p = g.attributes.position, uv = g.attributes.uv;
    const cs = [];
    for (let i = 0; i < p.count; i += 3) { const dv = Math.max(Math.abs(uv.getY(i)-uv.getY(i+1)), Math.abs(uv.getY(i+1)-uv.getY(i+2)), Math.abs(uv.getY(i)-uv.getY(i+2))); if (dv > 0.5) cs.push([+((p.getX(i)+p.getX(i+1)+p.getX(i+2))/3).toFixed(3), +((p.getY(i)+p.getY(i+1)+p.getY(i+2))/3).toFixed(3), +((p.getZ(i)+p.getZ(i+1)+p.getZ(i+2))/3).toFixed(3), +dv.toFixed(2)]); }
    out.seamCentroids = cs; }
  // 2. real templates
  out.real = {};
  const check = (label, root) => {
    let bad = 0, tris = 0, worst = 0; const list = [];
    root.traverse(o => {
      if (!o.isMesh || o.name.startsWith('custom')) return;
      const key = o.name.split(':').slice(1).join(':');
      const su = WMat.UV_SCALE[key] || WMat.DEFAULT_UV_SCALE;
      const a = analyze(o.geometry, su);
      tris += a.tris; bad += a.bad; worst = Math.max(worst, a.worst);
      if (a.bad) list.push(`${o.name}: bad ${a.bad}/${a.tris} worst ${a.worst} area% ${a.badAreaPct}`);
    });
    out.real[label] = { tris, bad, worst, list };
  };
  for (const id of ['pistol', 'rifle', 'shotgun', 'sniper', 'rocket']) {
    check(id + ':view', WM.createWeaponModel(id, { view: true }).root);
    check(id + ':world', WM.createWeaponModel(id, { view: false }).root);
  }
  check('grenade', WM.createGrenadeModel());
  check('rocketProj', WM.createRocketModel());
} catch (e) { window.__RES__.error = String(e && e.stack || e); }
window.__DONE__ = true;
</script></body></html>
